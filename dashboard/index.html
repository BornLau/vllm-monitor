<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>vLLM · 模型监控</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1118;--panel:#121b26;--line:#293440;--text:#ecf1f6;--muted:#94a4b6;--green:#74dfba;--amber:#f4c477;--red:#ff9299}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;background:#1b2734;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 15px;font-size:14px}button:hover{border-color:var(--green)}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--green);outline-offset:4px}button:disabled{opacity:.5;cursor:wait}a{color:var(--green)}.primary{background:var(--green);color:#09271e;border-color:var(--green);font-weight:650}.muted{color:var(--muted)}
    .topbar{height:72px;border-bottom:1px solid var(--line);padding:0 36px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:700;letter-spacing:-.5px}.brand span{color:var(--green)}.brand small{font-size:14px;font-weight:400;color:var(--muted);margin-left:16px;letter-spacing:0}.top-actions,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.quiet{background:transparent}.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:5px;font-size:13px;background:#1b2936;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;background:currentColor;border-radius:50%}.ok{color:var(--green)}.warning{color:var(--amber)}.critical{color:var(--red)}.pill.ok{background:#19372e}.pill.warning{background:#362e20}.pill.critical{background:#39242c}
    main{max-width:1352px;margin:auto;padding:32px 36px 20px}.demo-notice{background:#162a35;border:1px solid #304c5b;border-radius:8px;padding:12px 16px;display:flex;justify-content:space-between;gap:15px;align-items:center;font-size:14px;margin-bottom:26px;color:#bcdaeb}.demo-notice a{color:#caeaff;white-space:nowrap}header{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:0 0 25px}h1{font-size:29px;letter-spacing:-.6px;margin:0 0 4px}header p{margin:0;color:var(--muted);font-size:14px}.overview{display:flex;align-items:center;gap:22px;flex-wrap:wrap;border-top:1px solid var(--line);padding:17px 0 22px;font-size:14px}.overview strong{font:600 20px ui-monospace,monospace;margin-right:5px}.overview .spacer{flex:1}.overview small{font-size:13px;color:var(--muted)}
    .models{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.model{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.model-head{padding:23px 24px 18px;display:flex;align-items:center;gap:13px}.model-icon{height:43px;width:43px;display:grid;place-items:center;background:#253a45;color:#aee5ea;font-weight:700;border:1px solid #38525a;border-radius:10px;flex:none}.model:nth-child(2n) .model-icon{background:#322d48;color:#d3bffe;border-color:#514365}.model-name{min-width:0;flex:1}.model-name h2{font-size:21px;line-height:1.4;margin:0;overflow-wrap:anywhere}.model-name span{font-size:12px;color:var(--muted)}.endpoint{margin:0 24px;padding:10px 13px;border:1px solid var(--line);border-radius:7px;background:#0e1620;display:flex;gap:10px;align-items:center}.endpoint code{font:12px/1.7 ui-monospace,SFMono-Regular,monospace;color:#b5c3d1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.endpoint span{font-size:12px;color:var(--muted);white-space:nowrap}.probe{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:13px 24px 18px;font-size:13px;border-bottom:1px solid var(--line)}.probe b{font-weight:500}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;padding:8px 24px}.metric{padding:16px 0;min-width:0}.metric:nth-child(even){padding-left:22px;border-left:1px solid var(--line)}.metric:nth-child(n+3){border-top:1px solid var(--line)}.metric-label{font-size:14px;color:var(--muted)}.metric-value{font:600 31px/1.5 ui-monospace,SFMono-Regular,monospace;letter-spacing:-1px}.metric-value small{font:13px system-ui;letter-spacing:0;color:var(--muted);margin-left:7px}.capacity{padding:14px 24px 22px}.capacity-label{display:flex;justify-content:space-between;gap:12px;font-size:14px}.capacity-label strong{font:600 16px ui-monospace,monospace}.meter{height:7px;border-radius:5px;background:#283340;margin:10px 0 8px;overflow:hidden}.meter i{height:100%;display:block;background:var(--green);border-radius:5px}.capacity small{font-size:12px;color:var(--muted)}.finding{border-top:1px solid var(--line);padding:17px 24px;background:#12241f}.finding.warning{background:#272319}.finding.critical{background:#291c22}.finding h3{font-size:14px;margin:0 0 3px;font-weight:600}.finding p{font-size:13px;margin:0;color:#b1bdc9}.model details{border-top:1px solid var(--line)}summary{cursor:pointer;color:var(--muted);font-size:13px;padding:13px 24px}.extra{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 24px 18px;font-size:13px}.extra div{display:flex;flex-direction:column;color:var(--muted)}.extra strong{font-size:16px;color:var(--text);font-weight:500}.notice{background:#30291b;color:var(--amber);border:1px solid #625035;padding:12px 16px;border-radius:8px;margin-bottom:18px;font-size:14px}.empty{border:1px dashed var(--line);border-radius:12px;padding:65px 24px;text-align:center;grid-column:1/-1}.empty h2{font-size:24px;margin:0 0 10px}.empty p{color:var(--muted);font-size:14px}.empty .actions{justify-content:center;margin-top:22px}footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:12px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
    dialog{background:var(--panel);color:var(--text);border:1px solid #384652;border-radius:12px;max-width:700px;width:calc(100% - 32px);padding:26px}dialog::backdrop{background:#000a}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:15px}dialog h2{margin:0;font-size:22px}dialog p{font-size:14px;color:var(--muted)}pre{font:13px/1.8 ui-monospace,monospace;background:#0b121b;border:1px solid var(--line);border-radius:7px;padding:15px;overflow:auto;color:#b5dfd0}.step{font-size:14px;font-weight:600;margin-top:20px}.config-layout{display:grid;grid-template-columns:1fr 1.25fr;gap:24px;margin-top:22px}.config-list{border-right:1px solid var(--line);padding-right:20px}.config-item{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.config-item strong{display:block;overflow-wrap:anywhere}.config-item small{display:block;font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin:4px 0 8px}.config-item button{font-size:12px;padding:5px 9px}.config-form label{display:block;font-size:14px;margin:0 0 13px}.config-form input:not([type=checkbox]){display:block;width:100%;padding:10px;margin-top:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px}.config-form small{display:block;color:var(--muted);font-size:12px;margin-top:5px}.config-form h3{font-size:17px;margin:0 0 15px}.config-form input[type=checkbox]{margin-right:6px}.danger{color:var(--red)}#guide{max-width:840px}.saved{color:var(--green);font-size:14px;margin-top:12px;min-height:22px}@media(max-width:650px){.config-layout{grid-template-columns:1fr}.config-list{border-right:0;border-bottom:1px solid var(--line);padding:0 0 16px}}.hint{border-left:2px solid #4d6577;padding-left:13px;font-size:13px;color:var(--muted)}[hidden]{display:none!important}
    @media(max-width:850px){.topbar{padding:0 20px}.brand small{display:none}main{padding:24px 20px}.models{grid-template-columns:1fr}.model-head{padding-top:20px}header{align-items:flex-start}.demo-notice{align-items:flex-start}.metric-value{font-size:30px}}@media(max-width:480px){.topbar{padding:0 15px}.top-actions .pill{display:none}main{padding:20px 15px}header{flex-direction:column}.demo-notice{flex-direction:column;gap:5px}.overview{gap:14px}.overview .spacer{display:none}.overview small{width:100%}.model-head{padding:18px}.endpoint{margin:0 18px}.model-name h2{font-size:19px}.metrics{padding:8px 18px}.capacity{padding-left:18px;padding-right:18px}.model-head>.pill{padding:4px 7px}.metric-value{font-size:28px}.probe{padding-left:18px;padding-right:18px}}
  </style>
</head>
<body>
  <div class="topbar"><div class="brand"><span>◈</span> vLLM <small>模型监控</small></div><div class="top-actions"><span id="mode" class="pill">实时监控</span><button id="setup" class="quiet">管理模型</button></div></div>
  <main>
    <div id="demo-notice" class="demo-notice" hidden><span><b>两个模型的面板示意</b> · 以下为固定示例数据，未连接真实推理服务。</span><a href="/">切换到真实监控 →</a></div>
    <header><div><h1>模型服务</h1><p>看入口是否可用，以及推理是否拥堵。</p></div><div class="actions"><button id="export">导出摘要</button><button id="refresh" class="primary">↻ 刷新</button></div></header>
    <div id="error" class="notice" role="alert" hidden></div>
    <div id="overview" class="overview"><span class="muted">正在读取服务状态…</span></div>
    <section id="models" class="models" aria-label="模型服务列表"></section>
    <footer><span id="updated">正在连接…</span><span>API 探测不产生推理请求 · P95 / 吞吐统计窗口为 15 分钟</span></footer>
  </main>
  <dialog id="guide">
    <div class="dialog-head"><h2>管理模型</h2><button id="close-guide" aria-label="关闭模型管理">关闭</button></div>
    <p id="config-description">保存后立即生效，无需重启。性能采集约 30 秒内发现新配置。</p>
    <div id="config-error" class="notice" role="alert" hidden></div>
    <div class="config-layout">
      <section class="config-list"><button id="add-model" class="quiet">＋ 添加模型</button><div id="config-models"></div></section>
      <form id="model-form" class="config-form">
        <h3 id="form-title">添加模型</h3>
        <label>模型名称<input id="model-name" name="name" required maxlength="100" placeholder="例如 GLM-5.3-Flash"></label>
        <label>服务 URL<input id="model-url" name="url" type="url" required maxlength="2048" placeholder="http://你的服务器:8080"><small>带不带 /v1 都可以，自动尝试同端口 /metrics。</small></label>
        <label>API Key<input id="model-key" name="api_key" type="password" maxlength="4096" autocomplete="new-password" placeholder="无需认证可留空"><small id="key-help">只保存在服务端，保存后不回显。</small></label>
        <label id="clear-key-label" hidden><input id="clear-key" type="checkbox">清除原 Key，改为无认证</label>
        <div class="actions"><button id="save-model" class="primary" type="submit">保存并接入</button><button id="cancel-edit" type="button" hidden>取消编辑</button></div>
      </form>
    </div>
    <div id="config-message" class="saved" role="status" aria-live="polite"></div>
    <p class="hint">模型配置自动保存到本地数据库，重启后仍保留。指标历史由 Prometheus 默认保存 30 天；API 探测结果目前只显示最新状态。</p>
  </dialog>
  <script>
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt = value => value == null ? '—' : Number(value).toLocaleString('zh-CN', {maximumFractionDigits:2});
    const demo = location.pathname === '/demo';
    let data = null, timer = null, busy = false;
    let config = null, editing = null, saving = false, reloadRequested = false;
    function performanceState(node) {
      if (node.values.up !== 1) return 'unavailable';
      if (node.findings.some(f => f[0] === 'critical')) return 'critical';
      if (node.findings.some(f => f[0] === 'warning')) return 'warning';
      return 'ok';
    }
    function metric(label, value, unit, level = '') {
      return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value ${level}">${fmt(value)}<small>${value == null ? '' : unit}</small></div></div>`;
    }
    function modelCard(project, node) {
      const v = node.values, state = performanceState(node), apiOK = node.api.state === 'ok';
      const apiState = apiOK ? 'ok' : node.api.state === 'error' ? 'critical' : 'warning';
      const apiLabel = apiOK ? 'API 在线' : node.api.state === 'error' ? 'API 异常' : 'API 未配置';
      let finding = node.findings.find(f => f[0] === 'critical') || node.findings[0];
      if (state === 'unavailable') finding = ['warning', '暂时只有入口状态', node.metrics_configured ? '性能指标暂不可用：该端口可能未开放 /metrics，或采集尚未就绪。' : '这个入口未接入性能指标。'];
      if (node.api.state === 'error') finding = ['critical', 'API 探测失败', node.api.message + '，请检查 URL、Key 和服务状态。'];
      const [level, title, advice] = finding;
      const extras = [['输入吞吐',v.input_tps,'tok/s'],['Token 间隔 P95',v.tpot == null ? null : v.tpot * 1000,'ms'],['请求耗时 P95',v.e2e,'s'],['前缀缓存命中',v.cache,'%'],['输入长度 P95',v.prompt,'tokens'],['近 1 小时抢占',v.preempt,'次']];
      const kvColor = (v.kv || 0) >= 90 ? 'var(--red)' : 'var(--green)';
      return `<article class="model">
        <div class="model-head"><div class="model-icon" aria-hidden="true">${esc((project.name || project.id).slice(0,1).toUpperCase())}</div><div class="model-name"><h2>${esc(project.name || project.id)}</h2><span>${project.nodes.length > 1 ? esc(node.name || node.id) : '独立服务入口'}</span></div><span class="pill ${apiState}"><i class="dot"></i>${apiLabel}</span></div>
        <div class="endpoint"><code title="${esc(node.api_base_url || node.metrics_url)}">${esc(node.api_base_url || node.metrics_url)}</code><span>${node.auth_configured ? 'Key 已配置' : '无 API Key'}</span></div>
        <div class="probe"><span class="muted">API 探测响应 <b class="${apiState}">${apiOK ? fmt(node.api.latency_ms) + ' ms' : esc(node.api.message)}</b></span><span class="${state === 'unavailable' ? 'muted' : 'ok'}">${state === 'unavailable' ? '性能指标不可用' : '● 指标已接入'}</span></div>
        <div class="metrics">${metric('正在运行',v.running,'请求')}${metric('等待队列',v.waiting,'请求',(v.waiting || 0) > 0 ? 'warning' : '')}${metric('输出吞吐',v.output_tps,'tok/s')}${metric('首字延迟 P95',v.ttft,'s')}</div>
        <div class="capacity"><div class="capacity-label"><span class="muted">KV Cache 占用</span><strong style="color:${v.kv == null ? 'var(--muted)' : kvColor}">${fmt(v.kv)}${v.kv == null ? '' : '%'}</strong></div><div class="meter"><i style="width:${Math.min(100,Math.max(0,v.kv || 0))}%;background:${kvColor}"></i></div><small>${v.kv == null ? '未取得内部指标，不按零计算' : '入口暴露的最高占用 · 高占用伴随排队时需要关注'}</small></div>
        <div class="finding ${level}"><h3>${level === 'ok' ? '✓ ' : '! '}${esc(title)}</h3><p>${esc(advice)}</p></div>
        ${demo ? '' : `<div style="padding:10px 24px;border-top:1px solid var(--line)"><button class="quiet" data-edit="${esc(project.id)}">编辑配置</button></div>`}<details><summary>更多指标与诊断</summary><div class="extra">${extras.map(([label,value,unit]) => `<div>${label}<strong>${fmt(value)}${value == null ? '' : ' ' + unit}</strong></div>`).join('')}</div>${node.findings.filter(f => f[1] !== title && state !== 'unavailable').map(([l,t,a]) => `<div class="finding ${l}"><h3>${esc(t)}</h3><p>${esc(a)}</p></div>`).join('')}<p class="muted" style="font-size:12px;padding:0 24px 12px">API 响应时间为 /models 探测耗时，不是生成延迟。缺失指标显示 —。</p></details>
      </article>`;
    }
    function render() {
      const entries = data.projects.flatMap(p => p.nodes.map(n => [p,n]));
      const online = entries.filter(([,n]) => n.api.state === 'ok').length;
      const attention = entries.filter(([,n]) => n.api.state === 'error' || ['warning','critical'].includes(performanceState(n))).length;
      $('mode').textContent = demo ? '示例数据' : '实时监控';
      $('demo-notice').hidden = !demo;
      $('overview').innerHTML = `<span><strong>${entries.length}</strong>个服务入口</span><span class="ok"><strong>${online}</strong>API 在线</span><span class="${attention ? 'warning' : 'muted'}"><strong>${attention}</strong>需关注</span><span class="spacer"></span><small>${demo ? '示例假设两个端口均开放 /metrics' : '每 ' + data.refresh_seconds + ' 秒刷新'}</small>`;
      $('models').innerHTML = entries.length ? entries.map(([p,n]) => modelCard(p,n)).join('') : `<div class="empty"><h2>接入你的第一个模型</h2><p>每个模型填写名称、URL 和 API Key，其他自动处理。</p><div class="actions"><button class="primary" data-setup>添加模型</button><a href="/demo">先看两个模型的面板示意 →</a></div></div>`;
      $('updated').textContent = demo ? '演示模式 · 固定示例数值' : '最近采集：' + data.collected_at;
      $('export').disabled = !entries.length;
      $('refresh').textContent = demo ? '↻ 重载示意' : '↻ 刷新';
    }
    async function load() {
      if (busy) { reloadRequested = true; return; }
      busy = true; reloadRequested = false; clearTimeout(timer); $('refresh').disabled = true;
      try {
        const r = await fetch(demo ? '/api/demo' : '/api/status', {signal:AbortSignal.timeout(60000)});
        if (!r.ok) throw Error('HTTP ' + r.status);
        data = await r.json(); render();
        $('error').hidden = !Object.keys(data.errors).length;
        $('error').textContent = '性能指标采集暂不可用。API 在线状态仍单独探测，请检查 Prometheus 是否启动。';
      } catch (error) {
        $('error').hidden = false;
        $('error').textContent = '读取失败：' + error.message + (data ? '。当前保留上次结果，请留意采集时间。' : '。请检查监控服务。');
      } finally {
        busy = false; $('refresh').disabled = false;
        if (reloadRequested) timer = setTimeout(load, 0);
        else if (!demo) timer = setTimeout(load, (data?.refresh_seconds || 30) * 1000);
      }
    }
    function configError(message = '') {
      $('config-error').hidden = !message;
      $('config-error').textContent = message;
    }
    function resetForm(model = null) {
      editing = model;
      $('model-form').reset();
      $('model-name').value = model?.name || '';
      $('model-url').value = model?.url || '';
      $('model-key').value = '';
      $('model-key').disabled = false;
      $('clear-key-label').hidden = !model?.has_api_key;
      $('key-help').textContent = model?.has_api_key ? '留空保留原 Key；填写新 Key 可替换。修改 URL 时原 Key 会用于新地址。' : '无需认证可留空。Key 只保存在服务端，不回显。';
      $('model-key').placeholder = model?.has_api_key ? '已配置 · 留空保留' : '无需认证可留空';
      $('form-title').textContent = model ? '编辑模型' : '添加模型';
      $('save-model').textContent = model ? '保存修改' : '保存并接入';
      $('cancel-edit').hidden = !model;
      configError();
    }
    async function readConfig() {
      const r = await fetch('/api/config');
      const body = await r.json();
      if (!r.ok) throw Error(body.error || '读取配置失败');
      config = body;
      $('config-models').innerHTML = config.models.length ? config.models.map(m => `<div class="config-item"><strong>${esc(m.name)}</strong><small>${esc(m.url)} · ${m.has_api_key ? 'Key 已配置' : '无 API Key'}</small><div class="actions">${m.editable ? `<button type="button" data-config-edit="${esc(m.id)}">编辑</button>` : '<small>旧版复杂配置</small>'}<button type="button" class="danger" data-config-delete="${esc(m.id)}">移除</button></div></div>`).join('') : '<p class="muted" style="font-size:14px">还没有真实模型。填写模型信息即可接入。</p>';
    }
    async function openConfig(id = null) {
      if (saving) return;
      $('guide').showModal();
      $('config-message').textContent = '';
      $('config-description').textContent = demo ? '这里管理真实模型。保存后切换到真实监控，示例数据不会写入数据库。' : '保存后立即生效，无需重启。性能采集约 30 秒内发现新配置。';
      resetForm();
      $('save-model').disabled = true;
      try {
        await readConfig();
        const model = config.models.find(m => m.id === id);
        if (id && !model) throw Error('模型已被移除，请刷新页面');
        if (model && !model.editable) throw Error('旧版复杂配置暂不支持在简化表单中编辑');
        resetForm(model || null);
        $('save-model').disabled = false;
      } catch (error) { configError(error.message); }
    }
    async function writeConfig(method, path, body) {
      const r = await fetch(path, {method, headers:{'Content-Type':'application/json','X-Config-Token':config.token}, body:JSON.stringify(body)});
      const result = await r.json();
      if (!r.ok) throw Error(result.error || '配置保存失败');
      return result;
    }
    function setSaving(value) {
      saving = value;
      for (const el of $('guide').querySelectorAll('button,input')) el.disabled = value;
      if (!value) $('model-key').disabled = $('clear-key').checked;
    }
    $('model-form').onsubmit = async event => {
      event.preventDefault();
      if (saving || !config) return;
      setSaving(true); configError(); $('config-message').textContent = '正在保存…';
      try {
        const body = {name:$('model-name').value, url:$('model-url').value, api_key:$('model-key').value, clear_key:$('clear-key').checked};
        if (editing) body.version = editing.version;
        await writeConfig(editing ? 'PUT' : 'POST', '/api/models' + (editing ? '/' + encodeURIComponent(editing.id) : ''), body);
        $('model-key').value = '';
        resetForm();
        $('config-message').textContent = '已保存，无需重启。正在更新监控。';
        await readConfig();
        if (demo) { location.href = '/'; return; }
        load();
      } catch (error) { configError(error.message); $('config-message').textContent = ''; }
      finally { setSaving(false); }
    };
    $('config-models').onclick = async event => {
      if (saving || !config) return;
      const edit = event.target.closest('[data-config-edit]'), remove = event.target.closest('[data-config-delete]');
      const model = config.models.find(m => m.id === (edit?.dataset.configEdit || remove?.dataset.configDelete));
      if (!model) return;
      if (edit) { resetForm(model); $('config-message').textContent = ''; return; }
      if (!confirm(`移除“${model.name}”的监控配置？将停止后续采集，已有指标历史会保留到期。`)) return;
      setSaving(true); configError();
      try {
        await writeConfig('DELETE', '/api/models/' + encodeURIComponent(model.id), {version:model.version});
        resetForm(); await readConfig();
        $('config-message').textContent = '已移除，已有指标历史仍保留。';
        if (!demo) load();
      } catch (error) { configError(error.message); }
      finally { setSaving(false); }
    };
    $('clear-key').onchange = () => { $('model-key').disabled = $('clear-key').checked; if ($('clear-key').checked) $('model-key').value = ''; };
    $('add-model').onclick = () => { resetForm(); $('config-message').textContent = ''; };
    $('cancel-edit').onclick = () => resetForm();
    $('setup').onclick = () => openConfig();
    $('close-guide').onclick = () => { if (!saving) { $('model-key').value = ''; $('guide').close(); } };
    $('guide').addEventListener('cancel', event => { if (saving) event.preventDefault(); });
    $('guide').addEventListener('close', () => { $('model-key').value = ''; });
    document.addEventListener('click', event => {
      if (event.target.closest('[data-setup]')) openConfig();
      const button = event.target.closest('[data-edit]');
      if (button) openConfig(button.dataset.edit);
    });
    $('refresh').onclick = load;
    $('export').onclick = async () => {
      try {
        const r = await fetch(demo ? '/api/demo/report' : '/api/report');
        if (!r.ok) throw Error('HTTP ' + r.status);
        const url = URL.createObjectURL(await r.blob()), a = document.createElement('a');
        a.href = url; a.download = demo ? 'vllm-demo-report.txt' : 'vllm-report.txt'; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (error) { $('error').hidden = false; $('error').textContent = '导出失败：' + error.message; }
    };
    load();
  </script>
</body>
</html>
